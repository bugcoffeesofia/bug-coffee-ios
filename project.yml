name: BugCoffee
options:
  bundleIdPrefix: com.bugcoffee
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: "FM4AWM58J6"

# Build configurations. `Debug-LocalPass` is a normal debug build with on-device
# Wallet pass creation/signing switched on via Config/LocalPassCreation.xcconfig
# (attached to the BugCoffee target below). Keep Debug/Release for everyday work.
configs:
  Debug: debug
  Release: release
  Debug-LocalPass: debug

packages:
  # Apple's X.509 / CMS stack — used to sign the .pkpass on-device.
  SwiftCertificates:
    url: https://github.com/apple/swift-certificates.git
    from: "1.0.0"
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.0.0"

schemes:
  # ⌘U runs everything: unit tests (Swift Testing, with coverage) and the
  # screenshot UI tests. The scripts narrow it down with -only-testing:
  #   Scripts/run_unit_tests.sh   → BugCoffeeTests + BugCoffeeMessagesTests
  #   Scripts/take_screenshots.sh → BugCoffeeUITests (writes docs/screenshots/)
  BugCoffee:
    build:
      targets:
        BugCoffee: all
        BugCoffeeTests: [test]
        BugCoffeeMessagesTests: [test]
        BugCoffeeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - BugCoffee
        - BugCoffeeMessagesTests
      targets:
        - BugCoffeeTests
        - BugCoffeeMessagesTests
        - BugCoffeeUITests
    archive:
      config: Release

  BugCoffeeMessages:
    build:
      targets:
        BugCoffeeMessages: all
        BugCoffee: [run]
    run:
      config: Debug
      # Extension schemes launch a host app (Messages) rather than the target.
      askForAppToLaunch: true
      launchAutomaticallySubstyle: 2
    archive:
      config: Release

  # ⌘U here runs the Watch screenshot UI tests (BugCoffeeWatchUITests), which
  # Scripts/take_screenshots.sh also runs on an Apple Watch simulator.
  BugCoffeeWatch:
    build:
      targets:
        BugCoffeeWatch: all
        BugCoffeeWatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BugCoffeeWatchUITests
    archive:
      config: Release

  # Same app, built with local (on-device) Wallet pass creation enabled. Use this
  # scheme when you want the "Add to Apple Wallet" and scan-a-QR-and-share buttons.
  # Everything it unlocks lives behind `#if LOCAL_PASS_CREATION`.
  BugCoffee-LocalPass:
    build:
      targets:
        BugCoffee: all
    run:
      config: Debug-LocalPass
    archive:
      config: Debug-LocalPass

  # The App Clip on its own (login → QR + stamps → Add to Apple Wallet). Runs the
  # Debug-LocalPass config because adding to Wallet is the point of the prototype
  # and, with no pass-issuing backend, the pass is signed on-device. Embedded in
  # the app, the clip follows the app's config instead (no Wallet button in
  # Debug/Release).
  BugCoffeeClip:
    build:
      targets:
        BugCoffeeClip: all
    run:
      config: Debug-LocalPass
    archive:
      config: Release

targets:
  BugCoffee:
    type: application
    platform: iOS
    # Only the Debug-LocalPass config gets the feature-flag xcconfig; Debug and
    # Release leave LOCAL_PASS_CREATION undefined, so that code is compiled out.
    configFiles:
      Debug-LocalPass: Config/LocalPassCreation.xcconfig
    sources:
      - path: BugCoffee/Sources
      - path: Shared
      - path: BugCoffee/Resources
      # Bundled pass images (icon/logo). Flattened into the app bundle so
      # PassBuilder can copy them into the unsigned pass at runtime.
      - path: PassTemplate
        buildPhase: resources
    dependencies:
      - package: SwiftCertificates
        product: X509
      - package: SwiftCrypto
        product: _CryptoExtras
      # Embed the Watch app into the iOS app.
      - target: BugCoffeeWatch
        embed: true
      # iMessage app (group coffee orders) — embedded into PlugIns.
      - target: BugCoffeeMessages
      # Home-screen stamp-card widget — embedded into PlugIns.
      - target: BugCoffeeStampWidget
      # App Clip (loyalty card only) — embedded into AppClips.
      - target: BugCoffeeClip
    # App Group so the widget can read the stamp count, plus HealthKit so
    # "Log a coffee" can write caffeine samples. XcodeGen regenerates this
    # .entitlements file from these properties, so declare everything here.
    entitlements:
      path: BugCoffee/BugCoffee.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bugcoffee.bugcoffee
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bugcoffee.bugcoffee
        INFOPLIST_FILE: BugCoffee/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"

  # App Clip: just the loyalty card — sign in, show the QR and the stamp count,
  # add the card to Apple Wallet. It compiles the app's own login, QR, stamp-sync
  # and pass code rather than copies; only the two files under AppClip/Sources
  # are its own.
  BugCoffeeClip:
    type: application.on-demand-install-capable
    platform: iOS
    # Same flag as the app: on-device pass signing only in Debug-LocalPass.
    configFiles:
      Debug-LocalPass: Config/LocalPassCreation.xcconfig
    sources:
      - path: AppClip/Sources
      - path: AppClip/Resources
      - path: BugCoffee/Sources/AdaptiveLayout.swift
      - path: BugCoffee/Sources/FirebaseAuth.swift
      - path: BugCoffee/Sources/LoginView.swift
      - path: BugCoffee/Sources/PassBuilder.swift
      - path: BugCoffee/Sources/PassSigner.swift
      - path: BugCoffee/Sources/PkPassZip.swift
      - path: BugCoffee/Sources/QRGenerator.swift
      - path: BugCoffee/Sources/StampWebSync.swift
      - path: BugCoffee/Sources/WalletUI.swift
      # Only because StampWebSync pushes the live count through it. The clip
      # never starts the watch session, so those pushes go nowhere.
      - path: BugCoffee/Sources/WatchSync.swift
      - path: BugCoffee/Sources/Zip.swift
      - path: Shared/SharedKeys.swift
      - path: Shared/StampCard.swift
      - path: BugCoffee/Resources/Assets.xcassets
      - path: PassTemplate
        buildPhase: resources
    dependencies:
      - package: SwiftCertificates
        product: X509
      - package: SwiftCrypto
        product: _CryptoExtras
    # The Pass Type ID certificate and key go into the bundle only when local
    # pass creation is on, so a Debug/Release clip carries no signing key.
    postBuildScripts:
      - name: Copy pass signing assets (local pass creation only)
        basedOnDependencyAnalysis: false
        script: |
          if [ "${LOCAL_PASS_CREATION_ENABLED}" = "YES" ]; then
            cp "${SRCROOT}/BugCoffee/Resources/Signing/"*.pem "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
          fi
    # The parent-application identifier is what makes this an App Clip of
    # BugCoffee; the App Group shares the stamp count with the app and widget.
    entitlements:
      path: AppClip/BugCoffeeClip.entitlements
      properties:
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)com.bugcoffee.bugcoffee
        com.apple.security.application-groups:
          - group.com.bugcoffee.bugcoffee
    settings:
      base:
        # An App Clip's bundle id must be the parent app's plus a suffix.
        PRODUCT_BUNDLE_IDENTIFIER: com.bugcoffee.bugcoffee.Clip
        INFOPLIST_FILE: AppClip/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # iMessage app: share a group coffee order in a chat; everyone taps the
  # bubble, picks their drinks, and sends the updated order back. The order
  # state travels inside the message URL (MSSession) — no server.
  BugCoffeeMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: MessagesExtension/Sources
      - path: MessagesExtension/Resources
      # Shared menu/model code (MenuItem, CoffeeMenu, FavoritesStore, BlendFinder)
      # — the order UI reuses it, same as the Watch and Widget targets.
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bugcoffee.bugcoffee.MessagesExtension
        INFOPLIST_FILE: MessagesExtension/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"

  # Home-screen widget: the stamp card. The count is tracked manually in the
  # app (the live one is App Check-gated) and shared via the App Group.
  BugCoffeeStampWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StampWidget/Sources
      - path: StampWidget/Resources
      - path: Shared
    entitlements:
      path: StampWidget/StampWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bugcoffee.bugcoffee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bugcoffee.bugcoffee.StampWidget
        INFOPLIST_FILE: StampWidget/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"

  # Unit tests for the iOS app (and the Shared code it compiles), hosted in
  # BugCoffee so they can `@testable import BugCoffee`.
  BugCoffeeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BugCoffeeTests
    dependencies:
      - target: BugCoffee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bugcoffee.bugcoffee.Tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"

  # Unit tests for the iMessage group order. An extension can't host tests, so
  # this bundle compiles the extension's model files itself (no host app).
  BugCoffeeMessagesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BugCoffeeMessagesTests
      - path: MessagesExtension/Sources/GroupOrder.swift
      - path: MessagesExtension/Sources/OrderStore.swift
      - path: MessagesExtension/Sources/OrderCardRenderer.swift
      - path: Shared/CoffeeMenu.swift
      - path: Shared/SharedKeys.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bugcoffee.bugcoffee.MessagesTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"

  # Screenshot UI tests (see BugCoffeeUITests/ScreenshotTests.swift).
  BugCoffeeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BugCoffeeUITests
    dependencies:
      - target: BugCoffee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bugcoffee.bugcoffee.UITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # The tests use Swift Testing. Xcode (26.x and 27.0) aliases `Testing` to
        # `_Testing_Unavailable` in UI-testing bundles, so `import Testing` fails
        # to build; clearing the alias lets it through, and the tests run and pass
        # (XCUIApplication works from @Test functions). Not officially supported
        # by Apple — if a future Xcode breaks it, switch the file back to XCTest.
        TESTING_FRAMEWORK_MODULE_ALIAS_FLAGS: ""

  # Screenshot UI tests for the Watch app (BugCoffeeWatchUITests/WatchScreenshotTests.swift).
  BugCoffeeWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: BugCoffeeWatchUITests
    dependencies:
      - target: BugCoffeeWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bugcoffee.bugcoffee.WatchUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.0"
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
        SUPPORTED_PLATFORMS: "watchos watchsimulator"

  BugCoffeeWatch:
    type: application
    platform: watchOS
    sources:
      - path: BugCoffeeWatch/Sources
      # Only the watchOS-safe Shared files. The rest of Shared is iOS-only
      # SwiftUI (e.g. BlendFinderView uses .segmented, unavailable on watchOS),
      # so pull in just what the Watch app references. BlendData.swift holds the
      # BlendFinderView-free scoring/data; StampCard.swift's views are watch-safe.
      - path: Shared/ImageDecode.swift
      - path: Shared/SharedKeys.swift
      - path: Shared/CoffeeMenu.swift
      - path: Shared/BlendData.swift
      - path: Shared/StampCard.swift
      # Caffeine logging reuses the phone's HealthKit logger verbatim.
      - path: BugCoffee/Sources/HealthLogger.swift
      - path: BugCoffeeWatch/Resources
    # HealthKit capability so the Watch app can write caffeine samples.
    entitlements:
      path: BugCoffeeWatch/BugCoffeeWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bugcoffee.bugcoffee.watchkitapp
        INFOPLIST_FILE: BugCoffeeWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.0"
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
        # Pin the platform explicitly. Under Xcode 26 the iOS build was
        # "specializing" this embedded watch dependency to the iOS Simulator
        # (compiling it with the iPhoneSimulator SDK → WCSessionDelegate
        # conformance failures), instead of building it for watchOS. An explicit
        # SUPPORTED_PLATFORMS keeps the build graph on the watch SDK.
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
