name: BugWallet
options:
  bundleIdPrefix: com.zerogravityroom
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: "4F5J749858"

# Build configurations. `Debug-LocalPass` is a normal debug build with on-device
# Wallet pass creation/signing switched on via Config/LocalPassCreation.xcconfig
# (attached to the BugWallet target below). Keep Debug/Release for everyday work.
configs:
  Debug: debug
  Release: release
  Debug-LocalPass: debug

packages:
  # Apple's X.509 / CMS stack — used to sign the .pkpass on-device.
  SwiftCertificates:
    url: https://github.com/apple/swift-certificates.git
    from: "1.0.0"
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.0.0"

schemes:
  # ⌘U runs everything: unit tests (Swift Testing, with coverage) and the
  # screenshot UI tests. The scripts narrow it down with -only-testing:
  #   Scripts/run_unit_tests.sh   → BugWalletTests + BugWalletMessagesTests
  #   Scripts/take_screenshots.sh → BugWalletUITests (writes docs/screenshots/)
  BugWallet:
    build:
      targets:
        BugWallet: all
        BugWalletTests: [test]
        BugWalletMessagesTests: [test]
        BugWalletUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - BugWallet
        - BugWalletMessagesTests
      targets:
        - BugWalletTests
        - BugWalletMessagesTests
        - BugWalletUITests
    archive:
      config: Release

  BugWalletMessages:
    build:
      targets:
        BugWalletMessages: all
        BugWallet: [run]
    run:
      config: Debug
      # Extension schemes launch a host app (Messages) rather than the target.
      askForAppToLaunch: true
      launchAutomaticallySubstyle: 2
    archive:
      config: Release

  # ⌘U here runs the Watch screenshot UI tests (BugWalletWatchUITests), which
  # Scripts/take_screenshots.sh also runs on an Apple Watch simulator.
  BugWalletWatch:
    build:
      targets:
        BugWalletWatch: all
        BugWalletWatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BugWalletWatchUITests
    archive:
      config: Release

  # Same app, built with local (on-device) Wallet pass creation enabled. Use this
  # scheme when you want the "Add to Apple Wallet" and scan-a-QR-and-share buttons.
  # Everything it unlocks lives behind `#if LOCAL_PASS_CREATION`.
  BugWallet-LocalPass:
    build:
      targets:
        BugWallet: all
    run:
      config: Debug-LocalPass
    archive:
      config: Debug-LocalPass

targets:
  BugWallet:
    type: application
    platform: iOS
    # Only the Debug-LocalPass config gets the feature-flag xcconfig; Debug and
    # Release leave LOCAL_PASS_CREATION undefined, so that code is compiled out.
    configFiles:
      Debug-LocalPass: Config/LocalPassCreation.xcconfig
    sources:
      - path: BugWallet/Sources
      - path: Shared
      - path: BugWallet/Resources
      # Bundled pass images (icon/logo). Flattened into the app bundle so
      # PassBuilder can copy them into the unsigned pass at runtime.
      - path: PassTemplate
        buildPhase: resources
    dependencies:
      - package: SwiftCertificates
        product: X509
      - package: SwiftCrypto
        product: _CryptoExtras
      # Embed the Watch app into the iOS app.
      - target: BugWalletWatch
        embed: true
      # iMessage app (group coffee orders) — embedded into PlugIns.
      - target: BugWalletMessages
      # Home-screen stamp-card widget — embedded into PlugIns.
      - target: BugWalletStampWidget
    # App Group so the widget can read the stamp count, plus HealthKit so
    # "Log a coffee" can write caffeine samples. XcodeGen regenerates this
    # .entitlements file from these properties, so declare everything here.
    entitlements:
      path: BugWallet/BugWallet.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zerogravityroom.bugwallet
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerogravityroom.bugwallet
        INFOPLIST_FILE: BugWallet/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"

  # iMessage app: share a group coffee order in a chat; everyone taps the
  # bubble, picks their drinks, and sends the updated order back. The order
  # state travels inside the message URL (MSSession) — no server.
  BugWalletMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: MessagesExtension/Sources
      - path: MessagesExtension/Resources
      # Shared menu/model code (MenuItem, CoffeeMenu, FavoritesStore, BlendFinder)
      # — the order UI reuses it, same as the Watch and Widget targets.
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerogravityroom.bugwallet.MessagesExtension
        INFOPLIST_FILE: MessagesExtension/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"

  # Home-screen widget: the stamp card. The count is tracked manually in the
  # app (the live one is App Check-gated) and shared via the App Group.
  BugWalletStampWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StampWidget/Sources
      - path: StampWidget/Resources
      - path: Shared
    entitlements:
      path: StampWidget/StampWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zerogravityroom.bugwallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerogravityroom.bugwallet.StampWidget
        INFOPLIST_FILE: StampWidget/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"

  # Unit tests for the iOS app (and the Shared code it compiles), hosted in
  # BugWallet so they can `@testable import BugWallet`.
  BugWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BugWalletTests
    dependencies:
      - target: BugWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerogravityroom.bugwallet.Tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"

  # Unit tests for the iMessage group order. An extension can't host tests, so
  # this bundle compiles the extension's model files itself (no host app).
  BugWalletMessagesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BugWalletMessagesTests
      - path: MessagesExtension/Sources/GroupOrder.swift
      - path: MessagesExtension/Sources/OrderStore.swift
      - path: MessagesExtension/Sources/OrderCardRenderer.swift
      - path: Shared/CoffeeMenu.swift
      - path: Shared/SharedKeys.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerogravityroom.bugwallet.MessagesTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"

  # Screenshot UI tests (see BugWalletUITests/ScreenshotTests.swift).
  BugWalletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BugWalletUITests
    dependencies:
      - target: BugWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerogravityroom.bugwallet.UITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # The tests use Swift Testing. Xcode (26.x and 27.0) aliases `Testing` to
        # `_Testing_Unavailable` in UI-testing bundles, so `import Testing` fails
        # to build; clearing the alias lets it through, and the tests run and pass
        # (XCUIApplication works from @Test functions). Not officially supported
        # by Apple — if a future Xcode breaks it, switch the file back to XCTest.
        TESTING_FRAMEWORK_MODULE_ALIAS_FLAGS: ""

  # Screenshot UI tests for the Watch app (BugWalletWatchUITests/WatchScreenshotTests.swift).
  BugWalletWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: BugWalletWatchUITests
    dependencies:
      - target: BugWalletWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerogravityroom.bugwallet.WatchUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.0"
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
        SUPPORTED_PLATFORMS: "watchos watchsimulator"

  BugWalletWatch:
    type: application
    platform: watchOS
    sources:
      - path: BugWalletWatch/Sources
      # Only the watchOS-safe Shared files. The rest of Shared is iOS-only
      # SwiftUI (e.g. BlendFinderView uses .segmented, unavailable on watchOS),
      # so pull in just what the Watch app references. BlendData.swift holds the
      # BlendFinderView-free scoring/data; StampCard.swift's views are watch-safe.
      - path: Shared/ImageDecode.swift
      - path: Shared/SharedKeys.swift
      - path: Shared/CoffeeMenu.swift
      - path: Shared/BlendData.swift
      - path: Shared/StampCard.swift
      # Caffeine logging reuses the phone's HealthKit logger verbatim.
      - path: BugWallet/Sources/HealthLogger.swift
      - path: BugWalletWatch/Resources
    # HealthKit capability so the Watch app can write caffeine samples.
    entitlements:
      path: BugWalletWatch/BugWalletWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerogravityroom.bugwallet.watchkitapp
        INFOPLIST_FILE: BugWalletWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.0"
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
        # Pin the platform explicitly. Under Xcode 26 the iOS build was
        # "specializing" this embedded watch dependency to the iOS Simulator
        # (compiling it with the iPhoneSimulator SDK → WCSessionDelegate
        # conformance failures), instead of building it for watchOS. An explicit
        # SUPPORTED_PLATFORMS keeps the build graph on the watch SDK.
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
